<style>
   /* 整体样式重置 */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
}

.background-setting {
  background-color: white;
  padding: 10px;
  border-radius: 5px;
  box-shadow: 0 0 5px rgba(0, 0, 0, 0.1);
  display: flex;
  align-items: center;
}

.background-setting label {
  flex-basis: 40px;
}

.background-setting input[type="color"] {
  margin-right: 10px;
}

.background-setting button {
  background-color: #007BFF;
  padding: 4px 6px;
  color: white;
  border: none;
  border-radius: 3px;
  cursor: pointer;
  width: 50px;
}

.background-setting button:hover {
  background-color: #0056b3;
}
</style>
